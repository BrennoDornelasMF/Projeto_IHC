<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Criar Anúncio</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topo">
      <h1><a class="brand" href="index.html">LarDoceLar</a></h1>
      <nav class="menu">
        <a href="index.html">Início</a>
        <a class="ativo" href="criar-anuncio.html">Criar Anúncio</a>
        <a href="meus-anuncios.html">Meus Anúncios</a>
        <a href="financiamento.html">Financiamento</a>
        <button id="logout-btn">Sair</button>
      </nav>
    </header>

    <main>
      <section class="secao-formulario">
        <h2 class="titulo-secao">Preencha os dados do imóvel</h2>
        <form class="form-anuncio" enctype="multipart/form-data">
          <label for="titulo">Título do imóvel</label>
          <input
            id="titulo"
            type="text"
            placeholder="Digite o título do imóvel"
            required
          />
          <label for="localizacao">Localização</label>
          <input
            id="localizacao"
            type="text"
            placeholder="Digite a localização"
            required
          />
          <label for="preco">Preço</label>
          <input
            id="preco"
            type="text"
            inputmode="numeric"
            placeholder="Digite o preço"
            required
          />
          <label for="descricao">Descrição</label>
          <textarea
            id="descricao"
            placeholder="Descreva o imóvel"
          ></textarea>

          <input
            type="file"
            id="imagem"
            accept="image/*"
            class="input-imagem"
          />
          <label
            for="imagem"
            class="botao-upload"
            aria-label="Adicionar imagem"
          >
            <span class="icone-upload" aria-hidden="true">&#8679;</span>
            <span>Adicionar Imagem</span>
          </label>

          <button type="submit" disabled>Publicar Imóvel</button>
        </form>
      </section>
    </main>
  </body>
</html>
